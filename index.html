<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chromosome Designs Next.js Project</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070807;
        color: #f4efe5;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(680px, calc(100% - 40px));
        border: 1px solid rgba(244, 239, 229, 0.18);
        padding: 32px;
        background: rgba(26, 27, 24, 0.72);
      }
      h1 {
        margin: 0 0 16px;
        line-height: 1;
      }
      code {
        color: #e2bd67;
      }
      p {
        color: #d8d0c0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Converted to Next.js + Tailwind</h1>
      <p>This directory is now a Next.js project. Install dependencies, then run the development server:</p>
      <p><code>npm install</code></p>
      <p><code>npm run dev</code></p>
      <p>Open <code>http://localhost:3000</code> to view the site.</p>
    </main>
  </body>
</html>
